# Public rotating boosted shop page.
title: "&8ʀᴏᴛᴀᴛɪɴɢ ꜱʜᴏᴘ"

filler:
  material: GRAY_STAINED_GLASS_PANE
  amount: 1
  name: " "
  lore: []
  custom-model-data: -1

# Middle row, columns 3-7 in a 3-row GUI.
slots: [11, 12, 13, 14, 15]

boost-lore:
  - "&#ffffffBoost: &#03fc88{boost}x"
  - "&#ffffffBoosted sell: &#03fc88{price}"
  - "&#a7b8b0Resets in {time}."

# Entries sourced from global-sell-prices.yml do not have shop-item metadata,
# so their complete public presentation lives here.
global-material:
  name: "&#03fc88{item}"
  lore:
    - "&#ff5d73Sell: {base_price}"
    - " "
    - "&#ffffffBoost: &#03fc88{boost}x"
    - "&#ffffffBoosted sell: &#03fc88{price}"
    - "&#a7b8b0Resets in {time}."

global-enchantment:
  name: "&#03fc88{item}"
  lore:
    - "&#ff5d73Sell: {base_price}"
    - " "
    - "&#ffffffBoost: &#03fc88{boost}x"
    - "&#ffffffBoosted sell: &#03fc88{price}"
    - "&#a7b8b0Resets in {time}."

global-potion:
  name: "&#03fc88{item}"
  lore:
    - "&#ff5d73Sell: {base_price}"
    - " "
    - "&#ffffffBoost: &#03fc88{boost}x"
    - "&#ffffffBoosted sell: &#03fc88{price}"
    - "&#a7b8b0Resets in {time}."

empty:
  slot: 13
  material: GRAY_DYE
  amount: 1
  name: "&#ff5d73No Boosts"
  lore:
    - "&#ffffffNo sellable rotating items available."
  custom-model-data: -1
