filler:
  material: GRAY_STAINED_GLASS_PANE
  amount: 1
  name: " "
  lore: []
  custom-model-data: -1

option:
  material: LIME_SHULKER_BOX
  amount: 1
  name: ":lime_shulker_box: &#03fc88&l{stacks} STACK{plural}"
