stock-insufficient: "{prefix}{bad}Only {theme}{stock}{bad} in stock."
buy-limit-reached: "{prefix}{bad}Buy limit left: {theme}{limit}{bad}."
permission-provider-missing: "{prefix}{bad}No Vault permission provider."
permission-already-owned: "{prefix}{bad}Permission already owned."

buy-success: "{prefix}{good}Bought {theme}{amount}x {item}{good} for {theme}{price}{good}."
sell-success: "{prefix}{good}Sold {theme}{amount}x {item}{good} for {theme}{price}{good}."
sellgui-success: "{prefix}{good}Sold {theme}{amount}{good} item(s) for {theme}{price}{good}."
sellgui-none: "{prefix}{bad}No sellable items found."
sellgui-empty: "{prefix}{bad}No items placed."
