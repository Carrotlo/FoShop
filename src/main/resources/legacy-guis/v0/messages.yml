sellgui-receipt-title: "{white}Receipt for sell\n\n"
sellgui-receipt-item-layout: "{good}{amount} x {item} {white}for {theme}{price}"
worth-lore: "{white}Worth: {theme}${worth}"

rotating-shop-disabled: "{prefix}{bad}Rotating shop is disabled."
