# FoShop editable messages.
# Tokens: {prefix} {theme} {muted} {white} {good} {bad}

tokens:
  prefix: "#03fc88FoShop &8» #a7b8b0"
  theme: "#03fc88"
  muted: "#a7b8b0"
  white: "#ffffff"
  good: "#3ecf8e"
  bad: "#ff5d73"

no-permission: "{prefix}{bad}No permission."
player-only: "{prefix}{bad}Players only."
