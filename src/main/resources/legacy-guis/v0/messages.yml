convert-report: "{prefix}{muted}{message}"
convert-fail: "{prefix}{bad}Conversion failed: {theme}{reason}"

editor-saved: "{prefix}{good}Saved."
editor-cancelled: "{prefix}{muted}Cancelled."
editor-invalid: "{prefix}{bad}Invalid: {theme}{reason}"
editor-file-logging-toggle: "{prefix}{muted}File logging {theme}{state}{muted}."
