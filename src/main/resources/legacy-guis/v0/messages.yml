version-current: "{prefix}{muted}Author: {theme}{author}{muted} | Version: {theme}{version}"

convert-usage: "{prefix}{muted}Usage: {theme}/foshopadmin convert <ShopGUIPlus|EconomyShopGUI> [dryrun]"
